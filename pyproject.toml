[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sso-integration-kit"
version = "1.0.0"
description = "Reference JWT single sign-on between a broker client area and a white-label analytics portal, with an integration console and the jwt-doctor CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alina" }]
keywords = ["jwt", "sso", "jwks", "integration", "fastapi", "debugging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Security",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "PyJWT[crypto]>=2.9",
  "cryptography>=42",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
jwt-doctor = "ssokit.doctor.cli:main"
ssokit-dev = "ssokit.devserver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101", "S105", "S106", "B008", "S112", "S310", "S704"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["E402"]
"src/ssokit/core/*" = ["BLE001"]
"src/ssokit/devserver.py" = ["S104"]
"src/ssokit/portal/market.py" = ["S311"]
