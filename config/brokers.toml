[brokers.orbis]
name = "Orbis Capital"
tagline = "Multi-asset trading since 2011"
issuer = "https://clients.orbis-capital.example"
audience = "lumen-analytics"
algorithm = "RS256"
kid = "orbis-2026-10"
private_key_path = "${SSOKIT_KEYS_DIR:-keys}/orbis-2026-10.pem"
portal_launch_url = "${PORTAL_PUBLIC_URL:-http://localhost:8000}/sso/orbis/launch"
launch_method = "post"
token_lifetime = 60

[brokers.orbis.theme]
primary = "#0B6E64"
primary_dark = "#07524A"
surface = "#F4F7F6"
monogram = "OC"

[brokers.vega]
name = "Vega Markets"
tagline = "Forex and CFDs with raw spreads"
issuer = "https://my.vegamarkets.example"
audience = "lumen-analytics"
algorithm = "HS256"
secret_env = "VEGA_SSO_SECRET"
portal_launch_url = "${PORTAL_PUBLIC_URL:-http://localhost:8000}/sso/vega/launch"
launch_method = "get"
token_lifetime = 60

[brokers.vega.theme]
primary = "#4B3BB8"
primary_dark = "#372A8F"
surface = "#F5F4FB"
monogram = "V"
